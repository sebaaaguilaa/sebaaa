<title>Repaso Kine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna de estudio centrada tipo "ficha clínica"; barra de ramos arriba, tarjeta de pregunta como protagonista. */
:root {
  --bg: #eef2f1;
  --paper: #fbfcfc;
  --ink: #13232a;
  --muted: #56686f;
  --line: #cfd9d8;
  --accent: #0e6f6a;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe8;
  --bad: #b23a3a;
  --bad-soft: #f6dede;
  --mid: #a46a07;
  --mid-soft: #f7ead0;
  --good: #23784a;
  --good-soft: #d9efe1;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1719; --paper: #152226; --ink: #e4eeee; --muted: #93a7ab; --line: #2a3c40;
    --accent: #4fc2b8; --accent-ink: #072523; --accent-soft: #173a39;
    --bad: #f08a8a; --bad-soft: #3d2022; --mid: #e3b25a; --mid-soft: #3a2f17; --good: #6fd39a; --good-soft: #193526;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1719; --paper: #152226; --ink: #e4eeee; --muted: #93a7ab; --line: #2a3c40;
  --accent: #4fc2b8; --accent-ink: #072523; --accent-soft: #173a39;
  --bad: #f08a8a; --bad-soft: #3d2022; --mid: #e3b25a; --mid-soft: #3a2f17; --good: #6fd39a; --good-soft: #193526;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; font-size: clamp(28px, 6vw, 40px); line-height: 1; margin: 0; letter-spacing: -0.01em; }
h1 small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
h2 { font-family: var(--f-display); font-weight: 600; font-stretch: 112%; font-size: 20px; margin: 0; text-wrap: balance; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

nav.tabs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 700 14px var(--f-body); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.ramos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 400 14px var(--f-body); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip .num { font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .num { color: var(--accent-ink); opacity: .85; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats div { background: var(--paper); padding: 10px 14px; display: grid; gap: 2px; }
.stats b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }

.block { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.block .label { margin-right: 4px; }
select, input, textarea { font: 400 16px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
textarea { min-height: 96px; resize: vertical; }
select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(10, 40, 40, .35); }
.card-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.box-meter { display: inline-flex; gap: 3px; align-items: center; }
.box-meter i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); display: block; }
.box-meter i.on { background: var(--accent); }
.question { font-family: var(--f-display); font-weight: 600; font-stretch: 112%; font-size: clamp(19px, 3.6vw, 23px); line-height: 1.3; text-wrap: balance; margin: 0; }
.answer { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 6px; white-space: pre-wrap; }
.source { font-size: 13px; color: var(--muted); font-style: italic; }

.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: 700 15px var(--f-body); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { border-radius: 8px; padding: 10px 8px; font: 700 14px var(--f-body); cursor: pointer; border: 1px solid; display: grid; gap: 2px; }
.rate button span { font-weight: 400; font-size: 12px; }
.r-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.r-mid { background: var(--mid-soft); color: var(--mid); border-color: var(--mid); }
.r-good { background: var(--good-soft); color: var(--good); border-color: var(--good); }

.feedback { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; }
.feedback ul { margin: 0; padding-left: 18px; }
.feedback .score { font-family: var(--f-mono); font-weight: 500; }

.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }

.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 10px; }
.empty p { margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

form.add { display: grid; gap: 12px; }
form.add .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
form.add label { display: grid; gap: 4px; font-size: 14px; font-weight: 700; }
@media (max-width: 520px) { form.add .two { grid-template-columns: 1fr; } .rate button { font-size: 13px; } }

.bank { display: grid; gap: 8px; }
.bank-item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.bank-item header { align-items: center; }
.bank-item p { margin: 0; }
.linkbtn { background: none; border: 0; color: var(--bad); font: 700 13px var(--f-body); cursor: pointer; padding: 4px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
</style>

<div class="wrap">
  <header>
    <h1>Repaso Kine<small>Recuperación activa con repaso espaciado</small></h1>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" id="tab-repasar" aria-selected="true" data-view="repasar">Repasar</button>
      <button role="tab" id="tab-agregar" aria-selected="false" data-view="agregar" hidden>Agregar</button>
      <button role="tab" id="tab-banco" aria-selected="false" data-view="banco">Banco</button>
    </nav>
  </header>

  <div class="ramos" id="ramos" aria-label="Filtrar por ramo"></div>

  <!-- REPASAR -->
  <section id="view-repasar" class="wrap" style="gap:14px">
    <div class="stats" aria-live="polite">
      <div><span class="label">Para hoy</span><b id="st-due">–</b></div>
      <div><span class="label">Dominadas</span><b id="st-mastered">–</b></div>
      <div><span class="label">En el banco</span><b id="st-total">–</b></div>
    </div>

    <div class="block">
      <span class="label">Bloque de hoy</span>
      <button class="chip" data-size="5" aria-pressed="false">Día ocupado · <span class="num">5</span></button>
      <button class="chip" data-size="10" aria-pressed="true">Día normal · <span class="num">10</span></button>
      <button class="chip" data-size="20" aria-pressed="false">Buena energía · <span class="num">20</span></button>
    </div>

    <div id="session"></div>
  </section>

  <!-- AGREGAR -->
  <section id="view-agregar" hidden>
    <form class="add card" id="add-form">
      <h2>Nueva pregunta</h2>
      <div class="two">
        <label for="f-ramo">Ramo
          <select id="f-ramo" required></select>
        </label>
        <label for="f-tema">Tema
          <input id="f-tema" placeholder="Ej.: Control motor" maxlength="80">
        </label>
      </div>
      <label for="f-q">Pregunta
        <textarea id="f-q" required placeholder="Formúlala para responder sin mirar: ¿Qué…? ¿Por qué…? ¿Cómo evaluarías…?"></textarea>
      </label>
      <label for="f-a">Respuesta esperada
        <textarea id="f-a" required placeholder="Lo esencial, en tus palabras."></textarea>
      </label>
      <label for="f-src">Fuente
        <input id="f-src" placeholder="Ej.: Clase 12 · PDF Shumway-Cook cap. 3" maxlength="140">
      </label>
      <div class="row"><button class="btn" type="submit" id="f-save">Guardar pregunta</button></div>
      <p class="status" id="f-status" role="status"></p>
    </form>
  </section>

  <!-- BANCO -->
  <section id="view-banco" hidden>
    <div class="bank" id="bank"></div>
  </section>

  <p class="note" id="foot">Tu avance se guarda en tu cuenta y se sincroniza entre computador, iPad y celular.</p>
</div>

<script>
(() => {
  const RAMOS = ["Neurorehabilitación", "Musculoesquelético", "Cardiorrespiratorio", "Otros ramos"];
  const INTERVALS = [0, 1, 3, 7, 14, 30, 60]; // días por nivel (0 = hoy)
  const $ = (s) => document.querySelector(s);

  const state = {
    db: null, user: null, uid: null, canAdd: false,
    bank: [],           // [{id, ramo, tema, pregunta, respuesta, fuente}]
    bankLoaded: false, bankError: null,
    prog: {},           // {cardId: {box, due, reps, lapses, last}}
    ramo: "Todos", size: 10,
    queue: [], idx: 0, done: 0, revealed: false, feedback: null, grading: false,
    sample: null, view: "repasar",
  };

  // ---------- fechas locales ----------
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  const inRamo = (c) => state.ramo === "Todos" || c.ramo === state.ramo;
  const isDue = (c) => { const p = state.prog[c.id]; return !p || p.due <= today(); };

  // ---------- respaldo local si no hay cuenta ----------
  const LS = "repaso-kine-prog";
  const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; } };
  const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify(state.prog)); } catch {} };

  // ---------- guardado del progreso (una escritura a la vez) ----------
  let saving = false, dirty = false;
  async function saveProg() {
    lsSave();
    if (!state.db || !state.uid) return;
    if (saving) { dirty = true; return; }
    saving = true;
    try {
      do {
        dirty = false;
        await state.db.doc("data/users/" + state.uid + "/progreso").set({ cards: JSON.parse(JSON.stringify(state.prog)), updated: Date.now() });
      } while (dirty);
    } catch (e) {
      $("#foot").textContent = "No se pudo guardar el avance en tu cuenta (queda en este dispositivo).";
    } finally { saving = false; }
  }

  // ---------- sesión ----------
  function buildQueue() {
    const due = state.bank.filter((c) => inRamo(c) && isDue(c));
    due.sort((a, b) => {
      const pa = state.prog[a.id], pb = state.prog[b.id];
      if (pa && !pb) return -1; if (!pa && pb) return 1;           // atrasadas antes que nuevas
      if (pa && pb) return pa.due < pb.due ? -1 : pa.due > pb.due ? 1 : pa.box - pb.box;
      return (a.creado || 0) - (b.creado || 0);
    });
    state.queue = due.slice(0, state.size);
    state.idx = 0; state.done = 0; state.revealed = false; state.feedback = null;
  }

  function rate(kind) {
    const card = state.queue[state.idx];
    if (!card) return;
    const p = Object.assign({ box: 0, reps: 0, lapses: 0 }, state.prog[card.id]);
    p.reps += 1; p.last = today();
    if (kind === "bad") { p.box = 1; p.lapses += 1; p.due = today(); if (!card._requeued) state.queue.push(Object.assign({}, card, { _requeued: true })); }
    else if (kind === "mid") { p.box = Math.max(1, p.box); p.due = addDays(1); }
    else { p.box = Math.min(6, p.box + 1); p.due = addDays(INTERVALS[p.box]); }
    state.prog[card.id] = p;
    state.idx += 1; state.done += 1; state.revealed = false; state.feedback = null;
    saveProg();
    render();
  }

  async function grade() {
    const card = state.queue[state.idx];
    const ans = $("#my-answer")?.value.trim();
    if (!card || !ans || !state.sample) return;
    state.grading = true; state.feedback = null; render(true);
    const prompt =
`Eres docente de Kinesiología. Corrige la respuesta de un estudiante comparándola con la respuesta de referencia.
Sé específico y breve. No inventes contenido fuera de la referencia; si la referencia parece incompleta, dilo en "comentario".

PREGUNTA: ${card.pregunta}
RESPUESTA DE REFERENCIA: ${card.respuesta}
RESPUESTA DEL ESTUDIANTE: ${ans}

Devuelve SOLO JSON con esta forma:
{"puntaje": 0-3 (0 no sabe, 1 vaga, 2 parcial, 3 completa), "bien": ["..."], "errores": ["..."], "falta": ["..."], "comentario": "una frase para conectar con la aplicación clínica"}`;
    try {
      const r = await state.sample.json(prompt, { modelTier: "quick" });
      state.feedback = r && typeof r === "object" ? r : { comentario: "No pude leer la corrección." };
    } catch (e) {
      const msg = { not_granted: "Activa el permiso para que Claude corrija tus respuestas.", rate_limited: "Demasiadas correcciones seguidas. Espera un momento." }[e.code] || "No se pudo corregir ahora. Compara tú con la respuesta.";
      state.feedback = { comentario: msg };
    }
    state.grading = false; state.revealed = true; render();
  }

  // ---------- render ----------
  function renderRamos() {
    const el = $("#ramos");
    const counts = {};
    for (const c of state.bank) if (isDue(c)) counts[c.ramo] = (counts[c.ramo] || 0) + 1;
    const all = Object.values(counts).reduce((a, b) => a + b, 0);
    const opts = ["Todos", ...RAMOS.filter((r) => r === "Otros ramos" ? state.bank.some((c) => c.ramo === r) : true)];
    el.replaceChildren(...opts.map((r) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", String(state.ramo === r));
      b.append(r + " ");
      const n = document.createElement("span"); n.className = "num"; n.textContent = r === "Todos" ? all : (counts[r] || 0);
      b.append(n);
      b.onclick = () => { state.ramo = r; buildQueue(); render(); };
      return b;
    }));
  }

  function renderStats() {
    const cards = state.bank.filter(inRamo);
    $("#st-due").textContent = state.bankLoaded ? cards.filter(isDue).length : "–";
    $("#st-mastered").textContent = state.bankLoaded ? cards.filter((c) => (state.prog[c.id]?.box || 0) >= 4).length : "–";
    $("#st-total").textContent = state.bankLoaded ? cards.length : "–";
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v); }
    for (const k of kids) if (k != null) e.append(k);
    return e;
  }

  function renderSession(keepAnswer) {
    const box = $("#session");
    const prevAnswer = keepAnswer ? $("#my-answer")?.value : "";

    if (!state.bankLoaded) {
      box.replaceChildren(el("div", { class: "empty" }, el("h2", {}, state.bankError || "Cargando tus preguntas…"),
        el("p", {}, "Las preguntas viven en tu cuenta para que las veas igual en el computador, el iPad y el celular.")));
      return;
    }
    if (!state.bank.length) {
      box.replaceChildren(el("div", { class: "empty" }, el("h2", {}, "Tu banco está vacío"),
        el("p", {}, "Agrega preguntas en la pestaña Agregar, o pídele a Claude que cree preguntas desde tus apuntes y transcripciones de Drive.")));
      return;
    }
    const card = state.queue[state.idx];
    if (!card) {
      const pending = state.bank.filter((c) => inRamo(c) && isDue(c)).length;
      const nextDates = state.bank.filter(inRamo).map((c) => state.prog[c.id]?.due).filter(Boolean).sort();
      const next = nextDates.find((d) => d > today());
      box.replaceChildren(el("div", { class: "empty" },
        el("h2", {}, state.done ? `Bloque terminado: ${state.done} respuestas` : "Nada pendiente en este ramo"),
        el("p", {}, pending ? `Quedan ${pending} preguntas para hoy. Puedes hacer otro bloque o parar aquí.` : next ? `Próximo repaso: ${next}.` : "Agrega más preguntas para seguir."),
        pending ? el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: () => { buildQueue(); render(); } }, "Otro bloque")) : null));
      return;
    }

    const p = state.prog[card.id];
    const meter = el("span", { class: "box-meter", title: "Nivel de dominio" }, ...Array.from({ length: 6 }, (_, i) => el("i", { class: i < (p?.box || 0) ? "on" : "" })));
    const total = state.queue.length;
    const progress = el("div", { class: "progress", "aria-hidden": "true" }, el("div", { style: `width:${Math.round((state.idx / total) * 100)}%` }));

    const parts = [
      progress,
      el("div", { class: "card-top" },
        el("span", { class: "tag" }, card.ramo + (card.tema ? " · " + card.tema : "")),
        el("span", { class: "label num" }, `${state.idx + 1} / ${total}`, " ", meter)),
      el("p", { class: "question" }, card.pregunta),
    ];

    const ta = el("textarea", { id: "my-answer", placeholder: "Escribe o dicta tu respuesta sin mirar. Luego compárala." });
    ta.value = prevAnswer || "";
    parts.push(el("label", { for: "my-answer", class: "label" }, "Tu respuesta"), ta);

    if (!state.revealed) {
      parts.push(el("div", { class: "row" },
        el("button", { class: "btn", type: "button", onclick: () => { state.revealed = true; render(true); } }, "Ver respuesta"),
        state.sample ? el("button", { class: "btn ghost", type: "button", disabled: state.grading ? "" : null, onclick: grade }, state.grading ? "Corrigiendo…" : "Corregir con Claude") : null));
      if (state.grading) parts.push(el("p", { class: "status" }, "Claude está revisando tu respuesta…"));
    } else {
      if (state.feedback) {
        const f = state.feedback;
        const list = (t, arr) => Array.isArray(arr) && arr.length ? el("div", {}, el("span", { class: "label" }, t), el("ul", {}, ...arr.map((x) => el("li", {}, String(x))))) : null;
        parts.push(el("div", { class: "feedback", role: "status" },
          typeof f.puntaje === "number" ? el("span", { class: "score" }, `Puntaje ${f.puntaje}/3`) : null,
          list("Bien", f.bien), list("Errores", f.errores), list("Falta", f.falta),
          f.comentario ? el("p", { style: "margin:0" }, String(f.comentario)) : null));
      }
      parts.push(el("div", { class: "answer" }, el("span", { class: "label" }, "Respuesta de referencia"), el("div", {}, card.respuesta),
        card.fuente ? el("span", { class: "source" }, "Fuente: " + card.fuente) : null));
      parts.push(el("div", { class: "label" }, "¿Cómo te fue?"));
      parts.push(el("div", { class: "rate" },
        el("button", { class: "r-bad", type: "button", onclick: () => rate("bad") }, "No la sabía", el("span", {}, "vuelve en este bloque")),
        el("button", { class: "r-mid", type: "button", onclick: () => rate("mid") }, "Con dudas", el("span", {}, "mañana")),
        el("button", { class: "r-good", type: "button", onclick: () => rate("good") }, "La sabía", el("span", {}, `en ${INTERVALS[Math.min(6, (p?.box || 0) + 1)]} días`))));
    }
    box.replaceChildren(el("div", { class: "card" }, ...parts));
  }

  function renderBank() {
    const list = state.bank.filter(inRamo).slice().sort((a, b) => (a.ramo + a.tema).localeCompare(b.ramo + b.tema));
    const box = $("#bank");
    if (!list.length) { box.replaceChildren(el("div", { class: "empty" }, el("p", {}, state.bankLoaded ? "No hay preguntas en este ramo." : "Cargando…"))); return; }
    box.replaceChildren(...list.map((c) => {
      const p = state.prog[c.id];
      const del = state.canAdd ? el("button", { class: "linkbtn", type: "button", onclick: async (ev) => {
        const b = ev.currentTarget;
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "¿Borrar? Toca de nuevo"; return; }
        b.disabled = true;
        try { await state.db.doc("banco/" + c.id).delete(); } catch { b.textContent = "No se pudo borrar"; }
      } }, "Borrar") : null;
      return el("article", { class: "bank-item" },
        el("header", {}, el("span", { class: "tag" }, c.ramo + (c.tema ? " · " + c.tema : "")),
          el("span", { class: "label num" }, p ? `nivel ${p.box} · repaso ${p.due}` : "nueva"), del),
        el("p", {}, c.pregunta));
    }));
  }

  function render(keepAnswer) {
    renderRamos(); renderStats();
    if (state.view === "repasar") renderSession(keepAnswer);
    if (state.view === "banco") renderBank();
  }

  // ---------- pestañas y controles ----------
  document.querySelectorAll("nav.tabs button").forEach((b) => b.onclick = () => {
    state.view = b.dataset.view;
    document.querySelectorAll("nav.tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    for (const v of ["repasar", "agregar", "banco"]) $("#view-" + v).hidden = v !== state.view;
    render();
  });
  document.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => {
    state.size = Number(b.dataset.size);
    try { localStorage.setItem("repaso-kine-size", String(state.size)); } catch {}
    document.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    buildQueue(); render();
  });
  try {
    const s = Number(localStorage.getItem("repaso-kine-size"));
    if ([5, 10, 20].includes(s)) { state.size = s; document.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.size) === s))); }
  } catch {}

  $("#f-ramo").replaceChildren(...RAMOS.map((r) => el("option", { value: r }, r)));
  $("#add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("#f-q").value.trim(), a = $("#f-a").value.trim();
    if (!q || !a || !state.db) return;
    $("#f-save").disabled = true; $("#f-status").textContent = "Guardando…";
    try {
      await state.db.collection("banco").add({ ramo: $("#f-ramo").value, tema: $("#f-tema").value.trim(), pregunta: q, respuesta: a, fuente: $("#f-src").value.trim(), creado: Date.now() });
      $("#f-q").value = ""; $("#f-a").value = "";
      $("#f-status").textContent = "Guardada. Aparecerá en tu próximo bloque.";
    } catch (err) {
      $("#f-status").textContent = err?.code === "quota_exceeded" ? "El banco está lleno. Borra preguntas antiguas para agregar más." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
    } finally { $("#f-save").disabled = false; }
  });

  // ---------- arranque ----------
  state.prog = lsLoad();
  render();

  (async () => {
    const cl = window.claude;
    if (!cl || !cl.use) { state.bankError = "Abre esta página desde Claude para ver tus preguntas."; render(); return; }
    const [db, user, sample] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("sample")]);
    state.db = db; state.user = user; state.sample = sample;
    if (!db) { state.bankError = "Inicia sesión en Claude para ver tus preguntas."; render(); return; }

    state.uid = user ? await user.id() : null;
    state.canAdd = user ? (await user.isOwner()) || (await user.canEdit()) : false;
    $("#tab-agregar").hidden = !state.canAdd;

    if (state.uid) {
      try {
        const snap = await db.doc("data/users/" + state.uid + "/progreso").get();
        if (snap.exists && snap.data()?.cards) state.prog = Object.assign({}, lsLoad(), snap.data().cards);
      } catch {}
    } else {
      $("#foot").textContent = "Sin cuenta, tu avance se guarda solo en este dispositivo.";
    }

    let first = true;
    const timer = setTimeout(() => { if (!state.bankLoaded) { state.bankError = "Tus preguntas aún no cargan. Revisa tu conexión."; render(); } }, 10000);
    db.collection("banco").onSnapshot((snap) => {
      state.bank = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) clearTimeout(timer);
      state.bankLoaded = true; state.bankError = null;
      if (first || !state.queue.length) { buildQueue(); first = false; }
      else state.queue = state.queue.filter((c) => state.bank.some((b) => b.id === c.id));
      render(true);
    }, () => { clearTimeout(timer); state.bankError = "No se pudieron cargar las preguntas."; render(); });
  })();
})();
</script>
